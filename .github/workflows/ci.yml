name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check PR commit messages
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          commits=$(git rev-list --reverse --no-merges "$BASE_SHA..$HEAD_SHA")
          test -n "$commits"
          message_file=$(mktemp)
          trap 'rm -f "$message_file"' EXIT
          while IFS= read -r commit; do
            git show --no-patch --format=%B "$commit" > "$message_file"
            pnpm exec nx run @baseline/source:commitlint --output-style=static -- --edit="$message_file"
          done <<< "$commits"

      - name: Check formatting
        run: pnpm exec nx run @baseline/source:format-check

      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Run checks
        run: pnpm exec nx run-many -t lint test build typecheck e2e
